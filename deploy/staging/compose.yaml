# Staging copy of production on the same host: its own Postgres and data
# volume, no tunnel, published on 127.0.0.1:${MEMOS_HOST_PORT:-5231}.
# Secrets are shared with production (../secrets), so the DSN in memos_dsn
# resolves to THIS project's "postgres" service on this project's network.
#
# Rehearse an upgrade (docs/MIGRATION_UPGRADE_PATH.md):
#   docker compose up -d postgres memos-secret-init
#   docker compose exec -T postgres pg_restore -U memos -d memos --no-owner < ~/backups/memos/<dump>
#   docker compose exec -T postgres psql -U memos -d memos -c "UPDATE system_setting SET value = jsonb_set(value::jsonb, '{schemaVersion}', '\"0.30.1\"')::text WHERE name = 'BASIC';"
#   docker compose --profile bridge up -d bridge      # wait for "started successfully", then:
#   docker compose --profile bridge rm -sf bridge
#   MEMOS_IMAGE=localhost/memos-custom:<sha>-amd64 docker compose up -d memos
name: memos-staging

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-memos}
      POSTGRES_USER: ${POSTGRES_USER:-memos}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend

  memos-secret-init:
    image: alpine:3.21
    restart: "no"
    command:
      - /bin/sh
      - -ec
      - install -m 0400 -o 10001 -g 10001 /run/secrets/memos_dsn /var/opt/memos/.memos_dsn
    secrets:
      - memos_dsn
    volumes:
      - memos_data:/var/opt/memos
    networks:
      - backend

  # One-shot upstream release that applies its own 0.31 series to a database
  # stamped 0.30.1. Upstream reads the DSN from MEMOS_DSN only, so the secret
  # is exported by a shell wrapper. Stop it once its log says "started successfully".
  bridge:
    image: docker.io/neosmemo/memos:0.31.0
    profiles: ["bridge"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - 'export MEMOS_DSN="$(cat /run/secrets/memos_dsn)"; exec /usr/local/memos/entrypoint.sh /usr/local/memos/memos'
    environment:
      MEMOS_DRIVER: postgres
      MEMOS_PORT: "5230"
    secrets:
      - memos_dsn
    volumes:
      - memos_data:/var/opt/memos
    networks:
      - backend

  memos:
    image: ${MEMOS_IMAGE:?set MEMOS_IMAGE to the image under test}
    depends_on:
      postgres:
        condition: service_healthy
      memos-secret-init:
        condition: service_completed_successfully
    environment:
      MEMOS_DRIVER: postgres
      MEMOS_DSN_FILE: /var/opt/memos/.memos_dsn
      MEMOS_PORT: "5230"
      MEMOS_INSTANCE_URL: ${MEMOS_INSTANCE_URL:-http://127.0.0.1:5231}
      MEMOS_TRUSTED_PROXIES: none
    ports:
      - "127.0.0.1:${MEMOS_HOST_PORT:-5231}:5230"
    volumes:
      - memos_data:/var/opt/memos
    networks:
      - backend

networks:
  backend: {}

volumes:
  postgres_data:
  memos_data:

secrets:
  postgres_password:
    file: ../secrets/postgres_password
  memos_dsn:
    file: ../secrets/memos_dsn
