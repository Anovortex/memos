syntax = "proto3";

package memos.api.v1;

import "api/v1/memo_service.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";

option go_package = "gen/api/v1";

service AIService {
  // Transcribe transcribes an audio file using an instance AI provider.
  rpc Transcribe(TranscribeRequest) returns (TranscribeResponse) {
    option (google.api.http) = {
      post: "/api/v1/ai:transcribe"
      body: "*"
    };
    option (google.api.method_signature) = "audio";
  }

  // SearchMemos ranks the calling user's own memos by semantic similarity to
  // the query. Results never include another user's memos.
  rpc SearchMemos(SearchMemosRequest) returns (SearchMemosResponse) {
    option (google.api.http) = {
      post: "/api/v1/ai:searchMemos"
      body: "*"
    };
    option (google.api.method_signature) = "query";
  }
}

message TranscribeRequest {
  // Required. Audio input.
  TranscriptionAudio audio = 1 [(google.api.field_behavior) = REQUIRED];
}

message TranscriptionAudio {
  oneof source {
    // Inline audio bytes.
    bytes content = 1 [(google.api.field_behavior) = INPUT_ONLY];

    // URI for audio content. Reserved for future use.
    string uri = 2;
  }

  // Optional. The uploaded filename.
  string filename = 3 [(google.api.field_behavior) = OPTIONAL];

  // Optional. The MIME type of the input audio.
  string content_type = 4 [(google.api.field_behavior) = OPTIONAL];
}

message TranscribeResponse {
  // The transcribed text.
  string text = 1;
}

message SearchMemosRequest {
  // Required. The natural-language search query.
  string query = 1 [(google.api.field_behavior) = REQUIRED];

  // Optional. Maximum results to return. Defaults to 20, capped at 50.
  int32 limit = 2 [(google.api.field_behavior) = OPTIONAL];
}

message SearchMemosResponse {
  message Result {
    // The matched memo.
    Memo memo = 1;

    // Cosine similarity of the memo to the query, higher is closer.
    float score = 2;
  }

  // Results ordered by descending score.
  repeated Result results = 1;
}
